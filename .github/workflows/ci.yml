name: CI - Reparo e uso do ambiente

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-smoke:
    timeout-minutes: 5
    name: Linting & Smoke Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Instalar ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Executar Linting (ShellCheck + bash -n)
        run: ./tests/lint.sh

      - name: Executar Smoke Tests (CLI + Módulos)
        run: ./tests/smoke.sh

  e2e-docker:
    timeout-minutes: 25
    name: Instalação e templates em Ubuntu descartável
    needs: lint-and-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Executar Suíte E2E em Container Docker
        run: ./tests/e2e_docker.sh

      - name: Verificar PostgreSQL e preservação de dados do Portainer
        run: ./tests/docker_services.sh

  bootstrap:
    name: Instalação automática em Ubuntu mínimo
    timeout-minutes: 25
    needs: lint-and-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
      - name: Validar bootstrap sem Git, Python ou curl pré-instalados
        run: ./tests/bootstrap_docker.sh

  ai-tools:
    name: Ferramentas de IA e memória local sem login
    timeout-minutes: 30
    needs: lint-and-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make test-ai
